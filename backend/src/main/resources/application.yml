spring:
  application:
    name: mannayeok-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mannayeok?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:mannayeok}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  observability:
    external-api-report-interval-ms: ${EXTERNAL_API_REPORT_INTERVAL_MS:60000}
  features:
    collaborative-meetings-enabled: ${COLLABORATIVE_MEETINGS_ENABLED:false}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login-requests: ${RATE_LIMIT_LOGIN_REQUESTS:10}
      login-window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
      auth-requests: ${RATE_LIMIT_AUTH_REQUESTS:30}
      auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
      proxy-requests: ${RATE_LIMIT_PROXY_REQUESTS:120}
      proxy-window-seconds: ${RATE_LIMIT_PROXY_WINDOW_SECONDS:60}
      share-create-requests: ${RATE_LIMIT_SHARE_CREATE_REQUESTS:20}
      share-create-window-seconds: ${RATE_LIMIT_SHARE_CREATE_WINDOW_SECONDS:3600}
  auth:
    jwt-secret: ${JWT_SECRET:local-development-jwt-secret-change-me-1234567890}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
    issuer: ${JWT_ISSUER:mannayeok}
    admin-secondary:
      verification-minutes: ${ADMIN_VERIFICATION_MINUTES:15}
    password-reset:
      enabled: ${MAIL_ENABLED:false}
      frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
      token-minutes: ${PASSWORD_RESET_TOKEN_MINUTES:30}
      cooldown-seconds: ${PASSWORD_RESET_COOLDOWN_SECONDS:60}
      mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
    kakao:
      client-id: ${KAKAO_OAUTH_CLIENT_ID:}
      client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
      admin-key: ${KAKAO_ADMIN_KEY:}
      redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/oauth/kakao/callback}
      frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    naver:
      client-id: ${NAVER_OAUTH_CLIENT_ID:}
      client-secret: ${NAVER_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${NAVER_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/oauth/naver/callback}
      frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}
  subway:
    base-url: https://apis.data.go.kr/B553766/path2
    service-key: ${SUBWAY_API_SERVICE_KEY:}
    timeout-seconds: 8
  kakao:
    local-base-url: https://dapi.kakao.com/v2/local/search
    mobility-base-url: https://apis-navi.kakaomobility.com
    rest-api-key: ${KAKAO_REST_API_KEY:}
    mobility-key: ${KAKAO_MOBILITY_KEY:}
    timeout-seconds: 8
